name: Release

on:
    push:
        tags:
            - 'v*'
            - '[0-9]+.[0-9]+.[0-9]+'

jobs:
    publish-npm:
        name: Publish to npm
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            - run: npm ci

            - run: npm run build

            - run: npm run test:run

            - run: npm publish

    publish-vscode:
        name: Build VSIX & Create Release
        runs-on: ubuntu-latest
        needs: publish-npm
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Install VSCode extension dependencies
              working-directory: vscode-hubl
              run: npm ci

            - name: Build VSIX
              working-directory: vscode-hubl
              run: npx @vscode/vsce package

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: vscode-hubl/*.vsix
                  generate_release_notes: true

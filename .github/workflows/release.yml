name: Release

on:
    push:
        tags:
            - 'v*'

jobs:
    publish-npm:
        name: Publish to npm
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Run tests
              run: npm run test:run

            - name: Publish to npm
              run: npm publish --access public --provenance

    publish-vscode:
        name: Build VSIX & Create Release
        runs-on: ubuntu-latest
        needs: publish-npm
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install VSCode extension dependencies
              working-directory: vscode-hubl
              run: npm ci

            - name: Build VSIX
              working-directory: vscode-hubl
              run: npx @vscode/vsce package

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: vscode-hubl/*.vsix
                  generate_release_notes: true
